name: Render Study Video Bilingual

on:
  workflow_dispatch:
  push:
    branches:
      - ai-video-studio
      - main
    paths:
      - 'video-studio/**'
      - '.github/workflows/render-study-video.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: en
            project: project.json
            build: build_en
            filename: How_Modern_Web_Applications_Actually_Work.mp4
            artifact: web-architecture-study-video-en
          - language: es
            project: project_es.json
            build: build_es
            filename: Como_Funcionan_Realmente_Las_Aplicaciones_Web.mp4
            artifact: web-architecture-study-video-es

    env:
      VIDEO_PROJECT: ${{ matrix.project }}
      VIDEO_BUILD: ${{ matrix.build }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: kokoro-${{ runner.os }}-v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r video-studio/requirements.txt

      - name: Generate narration with Kokoro
        run: python video-studio/scripts/tts_kokoro.py

      - name: Render documentary master
        run: python video-studio/scripts/render.py

      - name: Technical QA
        run: |
          ffprobe -v error \
            -show_entries format=duration:stream=codec_name,width,height,r_frame_rate,sample_rate \
            -of json \
            "video-studio/${{ matrix.build }}/${{ matrix.filename }}" \
            | tee "video-studio/${{ matrix.build }}/ffprobe.json"

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            video-studio/${{ matrix.build }}/${{ matrix.filename }}
            video-studio/${{ matrix.build }}/timings.json
            video-studio/${{ matrix.build }}/ffprobe.json
          retention-days: 5
          if-no-files-found: error
